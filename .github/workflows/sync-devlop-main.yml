name: Sync Develop with Main
on:
  schedule:
    - cron: '*/3 * * * *'  # Runs every 3 minutes

jobs:
  sync-develop:
    runs-on: ubuntu-latest

    steps:
      # Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Git user to commit the merge
      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Fetch all branches to ensure we have the latest
      - name: Fetch all branches
        run: git fetch --all

      # Checkout the develop branch
      - name: Checkout develop branch
        run: |
          git checkout develop
          git pull origin develop

      # Merge main into develop
      - name: Merge main into develop
        run: |
          git merge origin/main --no-edit || echo "Merge conflict detected, manual intervention needed."

      # Push changes back to develop
      - name: Push changes to develop
        run: |
          git push origin develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

